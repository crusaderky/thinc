name: Build

on:
  push:
    branches: [main, v8.3.x]
  pull_request:
    branches: ["*"]
  workflow_dispatch:  # allows you to trigger manually

# When this workflow is queued, automatically cancel any previous running
# or pending jobs from the same branch
concurrency:
  group: cidbuildwheel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    uses: explosion/gha-cibuildwheel/.github/workflows/cibuildwheel.yml@main
    permissions:
      contents: write
      actions: read
    with:
      wheel-name-pattern: "thinc-*.whl"
      pure-python: false
      create-release: ${{ startsWith(github.ref, 'refs/tags/release-') || startsWith(github.ref, 'refs/tags/prerelease-') && github.repository_owner == 'explosion' }}
      nightly-upload: ${{ github.event_name == 'workflow_dispatch' && github.repository_owner == 'explosion' && github.ref == 'refs/heads/v8.3.x' }}
    secrets:
      gh-token: ${{ secrets.GITHUB_TOKEN }}
      anaconda_nightly_upload_token: ${{ secrets.ANACONDA_ORG_UPLOAD_TOKEN }}
